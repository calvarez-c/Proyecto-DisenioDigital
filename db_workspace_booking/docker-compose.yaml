
services:
  db_workspace_booking:
    image: mysql:8.0
    container_name: workspace_booking
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_workspace_booking
      MYSQL_USER: workspace_booking
      MYSQL_PASSWORD: admin123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data: